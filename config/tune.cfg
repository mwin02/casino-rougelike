; Every [TUNE] value from docs/spec-v4.md lives here, checked against
; src/core/tune_schema.gd on load. Money is whole dollars at the ×100 scale
; (spec conventions); money ratios are integer percents. Heat numbers and
; probabilities are floats and keep their decimal point.

[heat]

; §1.1: m(r) through these points, linear between. m(1) = 1.
multiplier_ratios=[1.0, 2.0, 3.0]
multiplier_values=[1.0, 1.5, 2.0]
; §1.5: every action in a window after the first one acted in costs this much more.
second_window_surcharge=1.7
; §1.3: total bet ≤ 300% and ≥ 50% of the opening bet.
max_raise_pct=300
min_decrease_pct=50

[table_rolls]

; §1.2: each table rolls every action's base cost within [min, max] of its
; center, a range per stakes type and per family. Marks roll as information.
low_stakes_information=[-0.3, 0.15]
low_stakes_manipulation=[-0.3, 0.15]
high_stakes_information=[-0.3, 0.3]
high_stakes_manipulation=[-0.15, 0.3]

[tiers]

; §7.1: table heat where Watched, Marked and Backed off start, and the action
; cost multiplier in Clean, Watched and Marked.
thresholds=[30.0, 60.0, 90.0]
cost_multipliers=[1.0, 1.5, 2.0]

[cooling]

; §1.6: cooling rate, and stake_factor(bet) through these points, linear
; between: the bet's position between table min (0.0) and max (1.0).
cool_rate=0.1
stake_factor_positions=[0.0, 1.0]
stake_factor_values=[0.1, 1.0]

[actions]

; §2.3 base cost centers, blackjack reference. Each game section scales
; them: reveals (look ahead included) by reveal_cost_factor, manipulations by
; manipulation_cost_factor; mark is never scaled. Mark costs mark + mark_step
; for each mark already made this session.
partial_reveal=2.0
mark=3.0
mark_step=3.0
full_reveal=4.0
look_ahead=7.0
recolour=10.0
nudge=12.0
switch=20.0
palm=28.0

[blackjack]

; §3.1 house rules.
bust_threshold=22
natural_payout_num=3
natural_payout_den=2
dealer_stand=17
dealer_hits_soft_17=true
; Splits: same rank only, up to this many hands. Insurance: at most this
; percent of the opening bet, paying insurance_payout_num : _den.
max_split_hands=4
insurance_max_pct=50
insurance_payout_num=2
insurance_payout_den=1
; §1.1: each adjust adds this base before m(r), × the tier. §3: this game's
; factors on the [actions] centers.
bet_change_base=7.0
reveal_cost_factor=1.0
manipulation_cost_factor=1.0

[baccarat]

; §3.2: a banker win pays 1:1 less this commission; a tie bet pays
; tie_payout_num : _den.
banker_commission_pct=5
tie_payout_num=8
tie_payout_den=1
; §1.1: each adjust and side switch adds this base before m(r), × the tier.
; §3: this game's factors on the [actions] centers.
bet_change_base=4.0
reveal_cost_factor=2.0
manipulation_cost_factor=1.0

[high_low]

; §3.3: house cut, per-call payout floor (1×) and cap (3×), chain value cap
; (20× stake). §1.1: each adjust adds this base before m(r), × the tier.
; §3.3: this game's factors on the [actions] centers.
cut_pct=7
min_call_payout_pct=100
max_call_payout_pct=300
max_chain_pct=2000
bet_change_base=2.0
reveal_cost_factor=7.0
manipulation_cost_factor=3.5

[side_bets]

; §8, priced for one 52-card deck; every payout is n:1. Each side bet is at
; most cap_pct of the table max (a placeholder, set after testing).
cap_pct=25
; Perfect Pairs: mixed pair, coloured pair.
perfect_pairs=[10, 24]
; 21+3: straight flush, three of a kind, straight, flush.
twenty_one_plus_three=[35, 30, 12, 6]
; Bust It: the dealer busts on 3, 4, 5, 6, or 7 or more cards.
bust_it=[1, 2, 9, 35, 120]
; Dragon Bonus: a non-natural win by 4, 5, 6, 7, 8, 9; a natural win.
dragon_bonus=[1, 2, 3, 5, 10, 30]
dragon_natural=1
; Player Pair or Banker Pair; exact rank of High or Low's first card up.
pair=14
exact_rank=11
; Side-bet heat: a manipulation that raises the side bets' value by the
; table max costs this much heat, × the tier (about 300 dollars per heat on
; a manipulated side-bet win at any floor).
side_bet_heat=65.0

[deck]

; §4.1: removals stop at this many cards.
min_size=20
; §4.2: heat floor added per edit, per marked card, and Forged Papers' cut.
floor_per_removal=3.0
floor_per_addition=3.0
floor_per_rummage=3.0
floor_per_touch_up=3.0
floor_per_full_reforge=3.0
floor_per_cold_seal=1.0
floor_per_ink=1.0
floor_per_mark=1.0
floor_per_luminous_mark=0.5
forged_papers_floor_cut=10.0

[floors]

; §6.3, floors 1–5. Targets: about 5× growth per floor, max:min about 4:1 (§5.1).
start_bankroll=50000
quotas=[140000, 700000, 3500000, 17500000, 87500000]
low_stakes_min=[1000, 5000, 25000, 125000, 625000]
low_stakes_max=[4000, 20000, 100000, 500000, 2500000]
high_stakes_min=[5000, 25000, 125000, 625000, 3125000]
high_stakes_max=[20000, 100000, 500000, 2500000, 12500000]

[clock]

; §6.1 hands per floor (before signatures and items), §6.4 extra-hands cap.
hands_per_floor=60
extra_hands_cap=10

[shop]

; Prices as a share of the current floor quota: items by rarity (§6.4),
; reforge tiers (§4.1), consumables (§9).
common_pct=5
uncommon_pct=10
rare_pct=18
rummage_pct=3
touch_up_pct=6
full_reforge_pct=15
masking_tape_pct=3
cold_seal_pct=8

[run_heat]

; §7.3 rollover shares on standing up (or going broke) and on being backed
; off; §7.4 elevator shed range; §6.5 run heat shed per unused hand on cash out.
stand_up_rollover=0.2
backed_off_rollover=0.4
elevator_shed_min=15.0
elevator_shed_max=20.0
cash_out_shed_per_hand=1.0

[consequences]

; §7.2: chance the Marked consequence is a house deck swap, floors 1–5.
house_swap_chance=[0.2, 0.35, 0.5, 0.65, 0.8]

[pit_boss]

; §7.5: on a watched table, Watched applies from this table heat.
watched_from=0.0

[items]

; §9
slots=6
ink_charges_per_floor=2

[marker]

; §11: the house fronts at most this share of the quota.
max_share_pct=50
