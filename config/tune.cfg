; Every [TUNE] value from docs/spec-v4.md lives here, checked against
; src/core/tune_schema.gd on load. Money is whole dollars at the ×100 scale
; (spec conventions); money ratios are integer percents. Heat numbers and
; probabilities are floats and keep their decimal point.

[heat]

; §1.1: m(r) through these points, linear between. m(1) = 1.
multiplier_ratios=[1.0, 2.0, 3.0]
multiplier_values=[1.0, 1.5, 2.0]
; §1.2: each table rolls base costs within ±30% of the center.
base_cost_spread=0.3
; §1.3: total bet ≤ 300% and ≥ 50% of the opening bet.
max_raise_pct=300
min_decrease_pct=50

[cooling]

; §1.6
cool_rate=0.1

[actions]

; §2.3 base cost centers, blackjack reference. Mark costs mark + mark_step
; for each mark already made this session.
partial_reveal=2.0
mark=3.0
mark_step=3.0
full_reveal=4.0
look_ahead=7.0
recolour=10.0
nudge=12.0
switch=20.0
palm=28.0

[blackjack]

; §3.1 house rules.
bust_threshold=23
natural_payout_num=3
natural_payout_den=2
dealer_stand=17
dealer_hits_soft_17=true

[high_low]

; §3.3: house cut, per-call payout cap (3×), chain value cap (20× stake), and
; how many times their blackjack base the reveals cost here (3–4×).
cut_pct=7
max_call_payout_pct=300
max_chain_pct=2000
reveal_cost_factor=3.5

[deck]

; §4.1: removals stop at this many cards.
min_size=20
; §4.2: heat floor added per edit, per marked card, and Forged Papers' cut.
floor_per_removal=3.0
floor_per_addition=3.0
floor_per_rummage=3.0
floor_per_touch_up=3.0
floor_per_full_reforge=3.0
floor_per_cold_seal=1.0
floor_per_ink=1.0
floor_per_mark=1.0
floor_per_luminous_mark=0.5
forged_papers_floor_cut=10.0

[floors]

; §6.3, floors 1–5. Targets: about 5× growth per floor, max:min about 4:1 (§5.1).
start_bankroll=50000
quotas=[140000, 700000, 3500000, 17500000, 87500000]
low_stakes_min=[1000, 5000, 25000, 125000, 625000]
low_stakes_max=[4000, 20000, 100000, 500000, 2500000]
high_stakes_min=[5000, 25000, 125000, 625000, 3125000]
high_stakes_max=[20000, 100000, 500000, 2500000, 12500000]

[clock]

; §6.1 hands per floor (before signatures and items), §6.4 extra-hands cap.
hands_per_floor=60
extra_hands_cap=10

[shop]

; Prices as a share of the current floor quota: items by rarity (§6.4),
; reforge tiers (§4.1), consumables (§9).
common_pct=5
uncommon_pct=10
rare_pct=18
rummage_pct=3
touch_up_pct=6
full_reforge_pct=15
masking_tape_pct=3
cold_seal_pct=8

[run_heat]

; §7.3 voluntary stand-up rollover share; §7.4 elevator shed range; §6.5
; run heat shed per unused hand on cash out.
stand_up_rollover=0.5
elevator_shed_min=15.0
elevator_shed_max=20.0
cash_out_shed_per_hand=1.0

[consequences]

; §7.2: chance the Marked consequence is a house deck swap, floors 1–5.
house_swap_chance=[0.2, 0.35, 0.5, 0.65, 0.8]

[pit_boss]

; §7.5: on a watched table, Watched applies from this table heat.
watched_from=0.0

[items]

; §9
slots=6
ink_charges_per_floor=2

[marker]

; §11: the house fronts at most this share of the quota.
max_share_pct=50

[debug]

; Fixed bet for the block 0 debug table (floor 1 low-stakes minimum, §6.3).
debug_bet=1000
